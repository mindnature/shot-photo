name: Validate Shot Photo

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate JSON libraries
        run: |
          python -m json.tool references/photographer_profiles.json > /dev/null
          python -m json.tool references/variables.json > /dev/null
          python -m json.tool references/compatibility.json > /dev/null
          python -m json.tool references/reference_dna_schema.json > /dev/null
          python -m json.tool references/taste_profile.schema.json > /dev/null
          python -m json.tool references/series_recipes.json > /dev/null
          python -m json.tool references/series_entropy_rules.json > /dev/null
          python -m json.tool references/random_scene_expansions.json > /dev/null
          python -m json.tool examples/siran_taste.json > /dev/null

      - name: Compile scripts
        run: |
          python -m py_compile scripts/generate.py
          python -m py_compile scripts/generate_random.py
          python -m py_compile scripts/generate_series.py
          python -m py_compile scripts/update_taste.py

      - name: Smoke test base generator
        run: |
          python scripts/generate.py "一位短发中国女性" \
            --count 6 \
            --profile 东方盛夏 \
            --scene 盛夏荷塘 \
            --seed 42 > /tmp/shot-photo-output.md
          test -s /tmp/shot-photo-output.md

      - name: Smoke test taste feedback
        run: |
          cp examples/siran_taste.json /tmp/taste.json
          python scripts/update_taste.py /tmp/taste.json \
            --like lenses=35mm \
            --strong-like compositions=人物放在极侧边 \
            --dislike imperfections=轻微数码噪点
          python -m json.tool /tmp/taste.json > /dev/null
          python - <<'PY'
          import json
          p=json.load(open('/tmp/taste.json', encoding='utf-8'))
          assert p['sample_count'] == 1
          assert p['dimensions']['lenses']['35mm']['score'] > 0
          assert p['dimensions']['imperfections']['轻微数码噪点']['score'] < 0
          PY

      - name: Smoke test taste-aware generator
        run: |
          python scripts/generate.py "一位短发中国女性" \
            --count 6 \
            --intent "广州盛夏生活感" \
            --taste-profile /tmp/taste.json \
            --seed 42 > /tmp/shot-photo-taste-output.md
          test -s /tmp/shot-photo-taste-output.md
          grep -q "Taste:" /tmp/shot-photo-taste-output.md

      - name: Smoke test six-frame series entropy
        run: |
          python scripts/generate_series.py "一位短发中国女性" \
            --count 6 \
            --scene 旧城区市场 \
            --intent "广州盛夏生活感" \
            --taste-profile /tmp/taste.json \
            --series-mode single-location \
            --time-arc static \
            --entropy-strength strong \
            --seed 42 \
            --format json > /tmp/series6.json
          python -m json.tool /tmp/series6.json > /dev/null
          python - <<'PY'
          import json
          d=json.load(open('/tmp/series6.json', encoding='utf-8'))
          assert d['series']['version'] == '0.8'
          assert d['series']['count'] == 6
          shots=d['shots']
          assert len(shots) == 6
          assert shots[0]['role'] == '建立空间'
          assert shots[-1]['role'] == '离场收束'
          assert len({s['plan']['wardrobe'] for s in shots}) == 1
          assert len({s['plan']['palette'] for s in shots}) == 1
          assert len({s['plan']['scene'] for s in shots}) == 1
          c=d['series']['coverage']
          q=d['series']['quota']
          assert c['shot_sizes'] >= q['min_unique_shot_sizes'], (c,q)
          assert c['camera_positions'] >= q['min_unique_camera_positions'], (c,q)
          assert c['action_states'] >= q['min_unique_action_states'], (c,q)
          assert c['compositions'] >= q['min_unique_compositions'], (c,q)
          assert c['observation_relationships'] >= q['min_unique_observation_relationships'], (c,q)
          assert c['small_subject_environment_images'] >= 1, c
          assert c['back_or_partial_back_images'] >= 1, c
          assert c['imperfect_images'] >= 1, c
          assert d['series']['text_suppression'] is True
          assert all('背景招牌只作为环境纹理' in s['prompt'] for s in shots)
          PY

      - name: Smoke test nine-frame controlled chaos
        run: |
          python scripts/generate_series.py "一个女生" \
            --count 9 \
            --scene 旧城区市场 \
            --intent "旅行写真，真实，不要宣传片感" \
            --series-mode single-location \
            --entropy-strength strong \
            --seed 7 \
            --format json > /tmp/series9.json
          python -m json.tool /tmp/series9.json > /dev/null
          python - <<'PY'
          import json
          d=json.load(open('/tmp/series9.json', encoding='utf-8'))
          c=d['series']['coverage']
          q=d['series']['quota']
          assert c['shot_sizes'] >= q['min_unique_shot_sizes'], (c,q)
          assert c['camera_positions'] >= q['min_unique_camera_positions'], (c,q)
          assert c['action_states'] >= q['min_unique_action_states'], (c,q)
          assert c['compositions'] >= q['min_unique_compositions'], (c,q)
          assert c['observation_relationships'] >= q['min_unique_observation_relationships'], (c,q)
          assert c['occlusion_or_reflection_images'] >= 2, c
          assert c['small_subject_environment_images'] >= 1, c
          assert c['back_or_partial_back_images'] >= 1, c
          assert c['imperfect_images'] >= 1, c
          assert len({s['entropy_role'] for s in d['shots']}) >= 8
          PY

      - name: Smoke test readable-text override
        run: |
          python scripts/generate_series.py "一个女生" \
            --count 6 \
            --scene 旧城区市场 \
            --allow-readable-text \
            --seed 5 \
            --format json > /tmp/series-text.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/series-text.json', encoding='utf-8'))
          assert d['series']['text_suppression'] is False
          assert all('背景招牌只作为环境纹理' not in s['prompt'] for s in d['shots'])
          PY

      - name: Smoke test strong random discovery
        run: |
          python scripts/generate_random.py "一个大学生，素颜" \
            --scene 校园 \
            --count 8 \
            --strength strong \
            --seed 42 \
            --format json > /tmp/random.json
          python -m json.tool /tmp/random.json > /dev/null
          python - <<'PY'
          import json
          d=json.load(open('/tmp/random.json', encoding='utf-8'))
          assert len(d['results']) == 8
          c=d['coverage']
          assert c['profiles'] >= 4, c
          assert c['scenes'] >= 6, c
          assert c['shot_sizes'] >= 3, c
          assert c['camera_positions'] >= 4, c
          assert c['observation_relationships'] >= 6, c
          assert c['compositions'] >= 4, c
          prompts=[x['prompt'] for x in d['results']]
          assert all(len(p) < 420 for p in prompts), [len(p) for p in prompts]
          assert len(set(prompts)) == len(prompts)
          PY

      - name: Smoke test wild random director
        run: |
          python scripts/generate_random.py "一个年轻女生" \
            --scene 校园 \
            --count 8 \
            --strength wild \
            --seed 7 \
            --format json > /tmp/random-wild.json
          python -m json.tool /tmp/random-wild.json > /dev/null
          python - <<'PY'
          import json
          d=json.load(open('/tmp/random-wild.json', encoding='utf-8'))
          c=d['coverage']
          assert c['profiles'] >= 4, c
          assert c['scenes'] >= 6, c
          assert c['observation_relationships'] >= 6, c
          prompts=[x['prompt'] for x in d['results']]
          assert all(len(p) < 360 for p in prompts), [len(p) for p in prompts]
          PY

      - name: Smoke test random taste dilution
        run: |
          python scripts/generate_random.py "一位短发中国女性" \
            --scene 广州 \
            --count 6 \
            --strength wild \
            --taste-profile /tmp/taste.json \
            --seed 7 > /tmp/random-wild.md
          test -s /tmp/random-wild.md
          grep -q "Random Discovery: wild · Images 2.5" /tmp/random-wild.md
