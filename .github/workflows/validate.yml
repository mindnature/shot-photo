name: Validate Shot Photo

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate JSON libraries
        run: |
          python -m json.tool references/photographer_profiles.json > /dev/null
          python -m json.tool references/variables.json > /dev/null
          python -m json.tool references/compatibility.json > /dev/null
          python -m json.tool references/reference_dna_schema.json > /dev/null
          python -m json.tool references/taste_profile.schema.json > /dev/null
          python -m json.tool examples/siran_taste.json > /dev/null

      - name: Compile scripts
        run: |
          python -m py_compile scripts/generate.py
          python -m py_compile scripts/update_taste.py

      - name: Smoke test base generator
        run: |
          python scripts/generate.py "一位短发中国女性" \
            --count 6 \
            --profile 东方盛夏 \
            --scene 盛夏荷塘 \
            --seed 42 > /tmp/shot-photo-output.md
          test -s /tmp/shot-photo-output.md

      - name: Smoke test taste feedback
        run: |
          cp examples/siran_taste.json /tmp/taste.json
          python scripts/update_taste.py /tmp/taste.json \
            --like lenses=35mm \
            --strong-like compositions=人物放在极侧边 \
            --dislike imperfections=轻微数码噪点
          python -m json.tool /tmp/taste.json > /dev/null
          python - <<'PY'
          import json
          p=json.load(open('/tmp/taste.json', encoding='utf-8'))
          assert p['sample_count'] == 1
          assert p['dimensions']['lenses']['35mm']['score'] > 0
          assert p['dimensions']['imperfections']['轻微数码噪点']['score'] < 0
          PY

      - name: Smoke test taste-aware generator
        run: |
          python scripts/generate.py "一位短发中国女性" \
            --count 6 \
            --intent "广州盛夏生活感" \
            --taste-profile /tmp/taste.json \
            --seed 42 > /tmp/shot-photo-taste-output.md
          test -s /tmp/shot-photo-taste-output.md
          grep -q "Taste:" /tmp/shot-photo-taste-output.md
